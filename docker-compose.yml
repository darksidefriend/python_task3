services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Монтируем папку data, а не файл
      - ./backend/data:/app/data
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge