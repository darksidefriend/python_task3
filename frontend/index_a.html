<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Глоссарий терминов - MindMap</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Подключаем vis.js с CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css">
    <!-- Стили для футера (вариант A) -->
    <style>
        footer {
            text-align: center;
            font-size: 0.9em;
            padding: 15px 0;
            border-top: 1px solid #ddd;
            margin-top: 20px;
            color: #333;
        }
        /* Ссылка остаётся стандартной */
    </style>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=107148061', 'ym');

        ym(107148061, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});

</head>
<body>
    <div class="container">
        <!-- Область для графа -->
        <div class="graph-container">
            <div id="mynetwork"></div>
        </div>
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="info-panel" id="info">
                <h3>Информация о термине</h3>
                <p>Выберите термин на графе</p>
            </div>
            <div class="form-panel">
                <h3>Управление терминами</h3>
                <form id="term-form">
                    <!-- Скрытое поле для хранения оригинального имени термина при редактировании -->
                    <input type="hidden" id="original-term" name="original-term">
                    
                    <label for="term">Термин:</label>
                    <input type="text" id="term" name="term" required>
                    
                    <label for="definition">Определение:</label>
                    <textarea id="definition" name="definition" rows="3" required></textarea>
                    
                    <label for="sources">Источники (URL через запятую):</label>
                    <textarea id="sources" name="sources" rows="2"></textarea>
                    
                    <label for="related">Связанные термины (через запятую):</label>
                    <textarea id="related" name="related" rows="2"></textarea>
                    
                    <div class="form-buttons">
                        <button type="button" id="add-btn">Добавить</button>
                        <button type="button" id="update-btn">Обновить</button>
                        <button type="button" id="delete-btn">Удалить</button>
                        <button type="button" id="clear-btn">Очистить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Футер с простой ссылкой (вариант A) -->
    <footer>
        <a href="https://github.com/darksidefriend" target="_blank" rel="noopener noreferrer">Мой профиль на GitHub</a>
    </footer>
    <!-- Наш скрипт -->
    <script src="/static/script.js"></script>
</body>
</html>
